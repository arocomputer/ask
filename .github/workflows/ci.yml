name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: ./x check
      # The black-box harness builds subprocesses without race instrumentation.
      - run: ./x test -race ./internal/...
      - name: Verify release artifacts and generated formula offline
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
        run: |
          .github/release/package.sh v0.0.0 "$RUNNER_TEMP/ask-release"
          .github/release/formula.sh v0.0.0 "$RUNNER_TEMP/ask-release/checksums.txt" > "$RUNNER_TEMP/ask.rb"
          ruby -c "$RUNNER_TEMP/ask.rb"
      - run: ./x audit
      # The installer people run, against the latest release.
      - run: sh install.sh --dir "$RUNNER_TEMP/ask" && "$RUNNER_TEMP/ask/ask" --version
  macOS:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The platform-specific parts; source and workflow checks run on Linux.
      - run: ./x lint
      - run: ./x test
      - run: ./x baymax
      - run: sh install.sh --dir "$RUNNER_TEMP/ask" && "$RUNNER_TEMP/ask/ask" --version
