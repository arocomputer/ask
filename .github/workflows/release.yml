name: Release

# A tag vX.Y.Z on main releases ask: the same checks as CI, archives for macOS and Linux with
# checksums and build provenance, notes from CHANGELOG.md, the Homebrew formula on main, and a
# real install of the release on both systems. scripts/release.sh makes the tag.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: The tag is on main and has notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$TAG is not on main" >&2; exit 1; }
          grep -q "^## $TAG " CHANGELOG.md || { echo "CHANGELOG.md has no ## $TAG section" >&2; exit 1; }
      - run: ./x check
      - run: ./x audit

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
      - name: Build archives and checksums
        env:
          TAG: ${{ github.ref_name }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          for os in linux darwin; do
            for arch in amd64 arm64; do
              target="ask_${TAG}_${os}_${arch}"
              mkdir -p "dist/$target"
              GOOS="$os" GOARCH="$arch" ./x build -trimpath -ldflags "-s -w -X main.version=${TAG}" -o "dist/$target/ask" ./cmd/ask
              cp LICENSE "dist/$target/"
              tar -C "dist/$target" -czf "dist/$target.tar.gz" ask LICENSE
              rm -r "dist/$target"
            done
          done
          (cd dist && sha256sum -- *.tar.gz > checksums.txt)
      # Proves each archive was built here, from this tag: gh attestation verify FILE -R arocomputer/ask
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # The notes are the tag's section of CHANGELOG.md, from its heading to the next.
        run: |
          awk -v tag="$TAG" '/^## /{on = index($0, "## " tag " ") == 1; next} on' CHANGELOG.md > notes.md
          test -s notes.md
          gh release create "$TAG" dist/*.tar.gz dist/checksums.txt --verify-tag --title "$TAG" --notes-file notes.md

  # The only job that writes to main uses the release environment (v* tags only)
  # and its deploy key. The other jobs here only read.
  formula:
    needs: release
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - name: Point the Homebrew formula at the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p checksums.txt -O "$RUNNER_TEMP/checksums.txt"
          scripts/formula.sh "$TAG" "$RUNNER_TEMP/checksums.txt" > ask.rb
          # Stage first: a brand-new formula is untracked, which git diff never shows.
          git add ask.rb
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "brew: ask $TAG"
          git push origin HEAD:main

  install:
    needs: release
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the release as people will
        env:
          TAG: ${{ github.ref_name }}
        run: |
          sh install.sh --version "$TAG" --dir "$RUNNER_TEMP/ask"
          test "$("$RUNNER_TEMP/ask/ask" --version)" = "$TAG"
