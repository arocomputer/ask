name: Release

# A tag vX.Y.Z on main releases ask: the same checks as CI, archives for macOS and Linux with
# checksums and build provenance, notes from CHANGELOG.md, the Homebrew formula on main, and a
# real install of the release on both systems. .github/release/release.sh asks Actions to make the tag. A
# vX.Y.Z-rc.N tag publishes a pre-release, which the formula and "latest" leave alone. A dry run
# builds and verifies everything for the commit without tagging or publishing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version to release, such as v0.3.0
        required: true
        type: string
      commit:
        description: Full SHA of the checked main commit
        required: true
        type: string
      dry_run:
        description: Build and verify the release without tagging or publishing
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    environment: release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ secrets.RELEASE_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Validate release and push its tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ inputs.commit }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          test "$GITHUB_REF" = refs/heads/main || { echo 'Run releases from main.' >&2; exit 1; }
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$ ]] || { echo "Invalid release tag: $TAG (vX.Y.Z or vX.Y.Z-rc.N)" >&2; exit 1; }
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid commit SHA.' >&2; exit 1; }
          if [ "$COMMIT" != "$GITHUB_SHA" ] || [ "$COMMIT" != "$(git rev-parse HEAD)" ]; then
            echo 'Main changed after the release was requested; check CI and retry.' >&2
            exit 1
          fi
          awk -v tag="$TAG" '
            /^## / { section = ($2 == tag); if (section) count++; next }
            section && /[^[:space:]]/ { body = 1 }
            END { exit !(count == 1 && body) }
          ' CHANGELOG.md || { echo 'Expected exactly one nonempty changelog section.' >&2; exit 1; }
          git show-ref --verify --quiet "refs/tags/$TAG" && { echo "$TAG already exists" >&2; exit 1; }
          result=$(gh run list --workflow ci.yml --branch main --event push --commit "$COMMIT" --json status,conclusion -q '.[0] | "\(.status) \(.conclusion)"')
          [ "$result" = 'completed success' ] || { echo "CI on main ($COMMIT) is '$result'; wait for it to pass." >&2; exit 1; }
          if [ "$DRY_RUN" = true ]; then
            .github/release/package.sh "$TAG" "$RUNNER_TEMP/dist"
            .github/release/formula.sh "$TAG" "$RUNNER_TEMP/dist/checksums.txt" > "$RUNNER_TEMP/ask.rb"
            ruby -c "$RUNNER_TEMP/ask.rb"
            echo "Dry run: $TAG would be built from $COMMIT; nothing was tagged or published."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG" "$COMMIT"
          git push origin "refs/tags/$TAG"

  check:
    permissions:
      actions: read
      contents: read
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: The tag is on main and has notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$ ]] || { echo "Invalid release tag: $TAG (vX.Y.Z or vX.Y.Z-rc.N)" >&2; exit 1; }
          git merge-base --is-ancestor HEAD origin/main || { echo "$TAG is not on main" >&2; exit 1; }
          awk -v tag="$TAG" '
            /^## / { section = ($2 == tag); if (section) count++; next }
            section && /[^[:space:]]/ { body = 1 }
            END { exit !(count == 1 && body) }
          ' CHANGELOG.md || { echo 'Expected exactly one nonempty changelog section.' >&2; exit 1; }
      - name: Check main CI for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit=$(git rev-parse HEAD)
          result=$(gh run list --workflow ci.yml --branch main --event push --commit "$commit" --json status,conclusion -q '.[0] | "\(.status) \(.conclusion)"')
          [ "$result" = 'completed success' ] || { echo "CI on main ($commit) is '$result'; wait for it to pass." >&2; exit 1; }
      - run: bun install --frozen-lockfile
      - run: npm run check
      - run: node --test 'test/**/*.test.ts'
      - run: bun test ./test/
      - run: shellcheck install.sh .github/release/*.sh
      - name: Check the workflows
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12 "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint"

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Build and verify archives and checksums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          pip install --quiet ziglang==0.13.0
          .github/release/package.sh "$TAG" dist
      - name: Check generated Homebrew formula syntax
        env:
          TAG: ${{ github.ref_name }}
        run: |
          .github/release/formula.sh "$TAG" dist/checksums.txt > "$RUNNER_TEMP/ask.rb"
          ruby -c "$RUNNER_TEMP/ask.rb"
      # Proves each archive was built here, from this tag: gh attestation verify FILE -R arocomputer/ask
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/checksums.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # The notes are the tag's section of CHANGELOG.md, from its heading to the next. A tag
        # with a hyphen (vX.Y.Z-rc.N) is a pre-release, which "latest" and the formula skip.
        run: |
          awk -v tag="$TAG" '/^## /{on = ($2 == tag); next} on' CHANGELOG.md > notes.md
          test -s notes.md
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" dist/*.tar.gz dist/checksums.txt --verify-tag --title "$TAG" --notes-file notes.md "${flags[@]}"

  # Refreshes the Homebrew formula after publishing the release.
  formula:
    needs: release
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: homebrew-formula
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ secrets.RELEASE_TOKEN }}
      - name: Point the Homebrew formula at the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          test "$TAG" = "$latest" || { echo 'Not the latest stable release; leaving the formula unchanged.'; exit 0; }
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p checksums.txt -O "$RUNNER_TEMP/checksums.txt"
          .github/release/formula.sh "$TAG" "$RUNNER_TEMP/checksums.txt" > ask.rb
          ruby -c ask.rb
          # Stage first: a brand-new formula is untracked, which git diff never shows.
          git add ask.rb
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "release: $TAG"
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          test "$TAG" = "$latest" || { echo 'Not the latest stable release; leaving the formula unchanged.'; exit 0; }
          git push origin HEAD:main

  install:
    needs: release
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the release as people will
        env:
          TAG: ${{ github.ref_name }}
        run: |
          sh install.sh --version "$TAG" --dir "$RUNNER_TEMP/ask"
          test "$("$RUNNER_TEMP/ask/ask" --version)" = "ask version ${TAG#v}"
