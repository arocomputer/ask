version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
    allow:
      - dependency-type: all
        update-types: ["version-update:semver-patch"]
    groups:
      go-dependencies:
        applies-to: version-updates
        patterns: ['*']
